# Local stack: the app plus its own throwaway Postgres.
#   docker compose up --build
# JWT_SECRET is required (put it in .env or export it). The database here is local only
# and is separate from your Neon database.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netbanking
      POSTGRES_USER: netbanking
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-netbanking-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbanking -d netbanking"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/netbanking
      DB_USERNAME: netbanking
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-netbanking-local}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ characters) in .env or your shell}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

volumes:
  pgdata:
