spring.application.name=netbanking

# Hosts like Render tell the app which port to use through PORT
server.port=${PORT:8080}

# Load .env from project root (optional so tests/CI don't break)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 'update' is fine while learning; Flyway + 'validate' comes later
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}

# Optional: seeds the first admin at startup if both are set
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
